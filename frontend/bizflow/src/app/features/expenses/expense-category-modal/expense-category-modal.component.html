<div class="modal-backdrop" (click)="cancelled.emit()">
  <section
    class="category-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="category-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-header">
      <div>
        <h2 id="category-modal-title">Add expense category</h2>
        <p>Create a category for organizing expenses.</p>
      </div>

      <button
        type="button"
        class="close-button"
        aria-label="Close"
        [disabled]="saving"
        (click)="cancelled.emit()"
      >
        &times;
      </button>
    </header>

    <form (ngSubmit)="submit()" #categoryForm="ngForm">
      <div class="form-group">
        <label for="category-name">Category name *</label>
        <input
          id="category-name"
          name="name"
          type="text"
          [(ngModel)]="name"
          maxlength="255"
          required
          autofocus
          placeholder="e.g. Transportation"
          [disabled]="saving"
        />
      </div>

      <div class="form-group">
        <label for="category-description">
          Description <span>(optional)</span>
        </label>
        <textarea
          id="category-description"
          name="description"
          [(ngModel)]="description"
          rows="3"
          placeholder="Describe this expense category"
          [disabled]="saving"
        ></textarea>
      </div>

      <div *ngIf="errorMessage" class="error-message" role="alert">
        {{ errorMessage }}
      </div>

      <footer class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          [disabled]="saving"
          (click)="cancelled.emit()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="saving || !name.trim()"
        >
          {{ saving ? 'Creating...' : 'Create category' }}
        </button>
      </footer>
    </form>
  </section>
</div>
