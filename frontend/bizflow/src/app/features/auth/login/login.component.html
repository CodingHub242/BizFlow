<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">B</div>

      <div>
        <h1>BizFlow</h1>
        <p>Business management made simple.</p>
      </div>
    </div>

    <div class="login-header">
      <h2>Welcome back</h2>
      <p>Sign in to your BizFlow account.</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-field">
        <label for="email">Email address</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="you@company.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error-message" role="alert">
          {{ errorMessage }}
        </div>
      }

      <button type="submit">
        Sign in
      </button>
    </form>
  </div>

  <p class="branding">&copy; Copyright Xavier Media Ltd. 2026</p>
</div>
